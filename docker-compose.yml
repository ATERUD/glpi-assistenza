services:

    database:
        image: mariadb:11
        container_name: glpi-database
        mem_limit: 1g
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: glpi
            MYSQL_USER: ${MYSQL_DB_USER}
            MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        volumes:
          - ./data/mariadb:/var/lib/mysql
        networks:
          glpi:
            ipv4_address: 172.22.0.3
        healthcheck:
          test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
          start_period: 10s
          interval: 10s
          timeout: 5s
          retries: 3

    glpi:
        image: diouxx/glpi:latest
        container_name: glpi
        mem_limit: 1g
        restart: unless-stopped
        depends_on:
          database:
            condition: service_healthy
        ports:
          - "127.0.0.1:8280:80"
        volumes:
          - /etc/timezone:/etc/timezone:ro
          - /etc/localtime:/etc/localtime:ro
          - ./data/glpi:/var/www/html/glpi/glpi/files
          - ./data/config:/var/www/html/glpi/config
          - ./data/plugins:/var/www/html/glpi/plugins
          - ./data/marketplace:/var/www/html/glpi/marketplace
        networks:
          glpi:
            ipv4_address: 172.22.0.5

        environment:
          - VERSION_GLPI=11.0.11
          - TIMEZONE=Europe/Rome 
        healthcheck:
          test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 60s 

    glpi-test:
        image: diouxx/glpi:latest
        container_name: glpi-test
        mem_limit: 512m 
        restart: unless-stopped
        depends_on:
          database:
            condition: service_healthy
        ports:
          - "127.0.0.1:8290:80"
        volumes:
          - /etc/timezone:/etc/timezone:ro
          - /etc/localtime:/etc/localtime:ro
          - ./data-test/glpi:/var/www/html/glpi/glpi/files
          - ./data-test/config:/var/www/html/glpi/config
        networks:
          glpi:
            ipv4_address: 172.22.0.15

        environment:
          - VERSION_GLPI=11.0.11
          - TIMEZONE=Europe/Rome 
  
        healthcheck:
          test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 60s 

    mysql-cron-backup:
        container_name: glpi-database-cron-backup
        image: fradelg/mysql-cron-backup
        mem_limit: 256m
        depends_on:
          database:
            condition: service_healthy
        volumes:
          - ${MYSQL_BACKUP_PATH}/glpi_backup:/backup
        networks:
          glpi:
            ipv4_address: 172.22.0.4
        environment:
          - MYSQL_HOST=172.22.0.3
          - MYSQL_USER=${MYSQL_DB_USER}
          - MYSQL_PASS=${MYSQL_DB_PASSWORD}
          - MAX_BACKUPS=10
          - INIT_BACKUP=0
          - TZ="Europe/Berlin"
          # Every day at 03:00
          - CRON_TIME=0 20 * * *
          # Make it small
          - GZIP_LEVEL=9
          # As of MySQL 8.0.21 this is needed
          - MYSQLDUMP_OPTS=--no-tablespaces
        restart: unless-stopped

networks:
  glpi:
    ipam:
      config:
        - subnet: 172.22.0.0/24
